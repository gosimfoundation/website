# Build-only check for pull requests. The deploy workflow (astro.yml) runs
# only on pushes to main, so without this a PR — including the Decap CMS
# editorial-workflow drafts — would have no status check to gate merging on.
name: CI

on:
  pull_request:

jobs:
  build:
    name: Build (PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npx --no-install astro build
